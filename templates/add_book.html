{% extends "base.html" %}

{% block title %}Add Book{% endblock %}

{% block content %}

<div class="form-page">

    <div class="form-card">

        <h1>Add Book</h1>

        <p class="form-description">
            Add a new book to your library.
        </p>


        {% if success %}
            <div class="success-message">
                Book successfully added!
            </div>
        {% endif %}


        <form method="POST">

            <div class="form-group">
                <label>Title</label>

                <input
                    type="text"
                    name="title"
                    placeholder="e.g. The Trial"
                    required
                >
            </div>


            <div class="form-group">
                <label>ISBN</label>

                <input
                    type="text"
                    name="isbn"
                    placeholder="978..."
                    required
                >
            </div>


            <div class="form-group">
                <label>Publication year</label>

                <input
                    type="number"
                    name="publication_year"
                    placeholder="1925"
                    required
                >
            </div>


            <div class="form-group">

                <label>Author</label>

                <select name="author_id" required>

                    <option value="" disabled selected>
                        Select an author
                    </option>

                    {% for author in authors %}
                        <option value="{{ author.id }}">
                            {{ author.name }}
                        </option>
                    {% endfor %}

                </select>

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Add Book
            </button>

        </form>

    </div>

</div>

{% endblock %}
